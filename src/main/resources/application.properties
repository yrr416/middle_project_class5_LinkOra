spring.application.name=project05
server.port=8080
spring.profiles.active=mysql
spring.profiles.include=local

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=org.study.project05

# /assets/** \uC815\uC801 \uD30C\uC77C (\uD504\uB85C\uC81D\uD2B8 \uB8E8\uD2B8 \uAE30\uC900 \uC0C1\uB300 \uACBD\uB85C)
app.assets-dir=assets

# \uD504\uB85C\uD544 \uC774\uBBF8\uC9C0 \uC5C5\uB85C\uB4DC

app.upload.profiles-dir=uploads/profiles
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# \uCE74\uCE74\uC624\u00B7\uB124\uC774\uBC84 \uB85C\uADF8\uC778 \uD0A4/Redirect URI\uB294 application-local.properties (spring.profiles.include=local)

# \uBA54\uC77C (SMTP \uC0C1\uC138\uB294 application-local.properties)
app.mail.mock-enabled=false
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@linkora.local}

# UTF-8
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

