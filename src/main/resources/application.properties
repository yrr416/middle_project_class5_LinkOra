spring.application.name=project05
server.port=8080
spring.profiles.active=mysql
spring.profiles.include=local

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=org.study.project05.member.vo,org.study.project05.partner.vo,org.study.project05.branch.vo,org.study.project05.mainpage.vo

# /assets/** 정적 파일 (프로젝트 루트 기준 상대 경로)
app.assets-dir=assets

# 프로필 이미지 업로드

app.upload.profiles-dir=uploads/profiles
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# 카카오·네이버 로그인 키/Redirect URI는 application-local.properties (spring.profiles.include=local)

# 메일 (SMTP 상세는 application-local.properties)
app.mail.mock-enabled=false
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@linkora.local}
