# 업로드 파일 저장 경로 (Docker 볼륨 마운트 위치)
app.uploads-dir=/app/uploads
app.upload.profiles-dir=/app/uploads/profiles
app.upload.notice-dir=/app/uploads/notice

# 소셜 로그인 Redirect URI (배포 서버 IP로 변경 필요)
kakao.redirect-uri=http://${SERVER_IP:localhost}:8080/linkora/kakaologin
naver.redirect-uri=http://${SERVER_IP:localhost}:8080/linkora/naverlogin

# 비밀번호 찾기 메일의 마이페이지 링크 (운영 도메인에 맞게 설정)
app.public-base-url=${APP_PUBLIC_BASE_URL:http://${SERVER_IP:localhost}:8080/linkora}

# 임시 비밀번호 유효 시간(분)
app.temp-password.ttl-minutes=${APP_TEMP_PASSWORD_TTL_MINUTES:10}
